# ============================================
# MinerU OCR / PDF Engine Configuration
# ============================================

mineru:
  enabled: true
  mode: "local"
  remote:
    base_url: "http://127.0.0.1:8764"
    token: "${MINERU_API_TOKEN:-}"
    timeout: 1800
  local:
    host: "127.0.0.1"
    start_on_boot: false
    startup_timeout: 60
    model_source: "modelscope"

soul:
  default_harness: "omp"
  default_model: ""
  train_concurrency: 4
