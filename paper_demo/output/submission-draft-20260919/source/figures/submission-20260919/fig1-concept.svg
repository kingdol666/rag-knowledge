<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">NISQ retrieval-process comparison</title><desc id="desc">BQ02 shared NISQ query. Left: current reproduction scripts use approximately 800-token windows, retrieve ten candidates, then pack two excerpts within a 4,000-character budget for single generation; provenance is not logged by this harness. Right: an agent executes QDCVR, reads candidates and self-assesses them on a 0–8 rubric. Initial score ≥6 yields a direct cited answer; score 5 is retained as a P1 backstop and scores ≤4 are discarded while fallback runs. After librarian fallback and read/recheck, P0 ≥6 supports a cited answer; usable P1 score 5 supports a qualified answer with attribution, including a retained backstop. Only no usable P0/P1 evidence yields a scoped not-found report. All QDCVR outcomes remain within the right-hand lane. This is not an accuracy comparison.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#253745" /></marker></defs>
<rect width="1000" height="590" fill="white" />
<g font-family="Calibri, Carlito, sans-serif"><rect x="20" y="16" width="960" height="48" rx="3" fill="#eaf2f9" stroke="#c5cfd5" /><text x="36" y="46" font-size="21" font-weight="600" fill="#253745" text-anchor="start">BQ02 · What defines NISQ technology and what is its central limitation?</text><path d="M500 64V79H254V92" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)" /><path d="M500 79H746V92" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)" /><rect x="20" y="94" width="468" height="324" rx="3" fill="#fafbfc" stroke="#c5cfd5" /><rect x="512" y="94" width="468" height="468" rx="3" fill="#fbfdfb" stroke="#c5cfd5" /><text x="36" y="123" font-size="23" font-weight="700" fill="#253745" text-anchor="start">Dense RAG (our reproduction)</text><text x="528" y="123" font-size="23" font-weight="700" fill="#253745" text-anchor="start">QDCVR (agent-executed skill)</text><path d="M40,140h43l14,14v71h-57Z" fill="white" stroke="#253745" stroke-width="1.2" /><path d="M83,140v14h14" fill="none" stroke="#253745" /><rect x="49" y="163" width="39" height="10" rx="3" fill="#eaf2f9" stroke="none" /><rect x="49" y="181" width="39" height="10" rx="3" fill="#eaf2f9" stroke="none" /><rect x="49" y="199" width="39" height="10" rx="3" fill="#eaf2f9" stroke="none" /><rect x="120" y="146" width="65" height="17" rx="3" fill="#eaf2f9" stroke="#c5cfd5" /><path d="M128 154h42" stroke="#7590a6" /><rect x="132" y="172" width="65" height="17" rx="3" fill="#eaf2f9" stroke="#c5cfd5" /><path d="M140 180h42" stroke="#7590a6" /><rect x="115" y="198" width="65" height="17" rx="3" fill="#eaf2f9" stroke="#c5cfd5" /><path d="M123 206h42" stroke="#7590a6" /><path d="M99 182H116" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)" /><text x="213" y="169" font-size="21" font-weight="600" fill="#253745" text-anchor="start">≈800-token windows</text><text x="213" y="199" font-size="20" font-weight="400" fill="#253745" text-anchor="start">Fixed fragments</text><path d="M254 226V240" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)" /><rect x="40" y="246" width="428" height="59" rx="3" fill="#eaf2f9" stroke="#c5cfd5" /><text x="56" y="270" font-size="21" font-weight="600" fill="#253745" text-anchor="start">Dense retrieval → pack 2 excerpts</text><text x="56" y="295" font-size="20" font-weight="400" fill="#253745" text-anchor="start">≤4,000-character evidence window</text><path d="M254 305V324" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)" /><rect x="40" y="330" width="428" height="40" rx="3" fill="#efedf7" stroke="#c5cfd5" /><text x="56" y="357" font-size="21" font-weight="600" fill="#253745" text-anchor="start">Single generation → answer</text><text x="40" y="400" font-size="20" font-weight="400" fill="#253745" text-anchor="start">Provenance not logged in this harness.</text><path d="M532,140h43l14,14v71h-57Z" fill="white" stroke="#253745" stroke-width="1.2" /><path d="M575,140v14h14" fill="none" stroke="#253745" /><rect x="541" y="163" width="39" height="10" rx="3" fill="#e7f3ec" stroke="none" /><rect x="541" y="181" width="39" height="10" rx="3" fill="#e7f3ec" stroke="none" /><rect x="541" y="199" width="39" height="10" rx="3" fill="#e7f3ec" stroke="none" /><text x="544" y="172" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="544" y="190" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="544" y="208" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="607" y="168" font-size="20" font-weight="600" fill="#253745" text-anchor="start">Organized, section-addressed parts</text><text x="607" y="198" font-size="19" font-weight="400" fill="#253745" text-anchor="start">base / document / part / section</text><path d="M746 226V240" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)" /><rect x="532" y="246" width="428" height="59" rx="3" fill="#e7f3ec" stroke="#c5cfd5" /><text x="548" y="270" font-size="21" font-weight="600" fill="#253745" text-anchor="start">Vector-first recall</text><text x="548" y="295" font-size="20" font-weight="400" fill="#253745" text-anchor="start">Read candidate text; score 0–8</text><path d="M746 305V324" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)" /><path d="M746 330L842 363L746 396L650 363Z" fill="#e7f3ec" stroke="#253745" /><text x="746" y="370" font-size="21" font-weight="600" fill="#253745" text-anchor="middle">Gate ≥ 6?</text><path d="M650 363H551V502" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)" /><text x="563" y="398" font-size="16" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">≥6: direct</text><path d="M842 363H935V407" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)" /><text x="849" y="400" font-size="16" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">Initial &lt;6</text><rect x="652" y="413" width="308" height="54" rx="3" fill="#f7efdf" stroke="#c5cfd5" /><text x="666" y="435" font-size="20" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">Librarian fallback</text><text x="666" y="457" font-size="16" font-weight="400" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">Keep 5; discard ≤4; read + recheck</text><path d="M677 467V478H612V502" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)" /><text x="626" y="497" font-size="14" font-weight="400" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">P0 ≥6</text><path d="M752 467V502" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)" /><text x="772" y="492" font-size="14" font-weight="400" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">P1 =5</text><path d="M901 467V502" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)" /><text x="913" y="486" font-size="14" font-weight="400" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">No usable</text><text x="913" y="502" font-size="14" font-weight="400" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">P0/P1</text><rect x="532" y="508" width="140" height="48" rx="3" fill="#e7f3ec" stroke="#c5cfd5" /><text x="542" y="527" font-size="17" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">Cited answer</text><text x="542" y="549" font-size="16" font-weight="400" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">Sources + limits</text><rect x="680" y="508" width="145" height="48" rx="3" fill="#efedf7" stroke="#c5cfd5" /><text x="690" y="527" font-size="16" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">Qualified answer</text><text x="690" y="549" font-size="16" font-weight="400" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">With attribution</text><rect x="833" y="508" width="127" height="48" rx="3" fill="#f7efdf" stroke="#c5cfd5" /><text x="843" y="527" font-size="17" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">Not found</text><text x="843" y="549" font-size="16" font-weight="400" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">Scoped report</text><text x="40" y="470" font-size="20" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">Compared configurations,</text><text x="40" y="497" font-size="19" font-weight="400" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">not a claim of accuracy superiority.</text><text x="20" y="582" font-size="16" font-weight="400" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">0–8 rubric: ≥6 direct; usable P1 =5 may support an attributed answer after fallback. Scores are agent judgments.</text></g></svg>