<!doctype html><html lang="en"><meta charset="utf-8"><title>fig2-architecture</title><style>@page{size:1000px 590px;margin:0}html,body{margin:0;width:1000px;height:590px}svg{display:block}</style><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="b-title b-desc"><title id="b-title">Platform services and agent-executed QDCVR workflow</title><desc id="b-desc">Web search uses HTTP, ragctl handles setup and services, and agents use an MCP adapter to shared backend primitives. The packaged agent skills execute content classification, the QDCVR gate and retry policy; these are not automatically enforced on every web or HTTP search. Web uploads use a selected destination; this diagram shows agent-assisted ingestion, not automatic routing of all uploads. Offline: MinerU parses PDFs into section Markdown; an agent reads and routes content into five demo bases and selects or propagates tags, with deterministic split, index and store primitives. This is not a guarantee that every MCP-created part is tagged. Evidence is stored using ChromaDB/BGE-M3, Neo4j and YAML metadata. Online agent-executed QDCVR: query rewrite, vector-first cross-base recall, candidate reading, and a 0–8 rubric. Initial ≥6 supports direct answering; initial score 5 is retained as a P1 backstop, while ≤4 is discarded; both trigger fallback. After reading and rechecking, P0 ≥6 supports a cited answer, usable P1 score 5 supports an attributed qualified answer, and only no usable P0/P1 supports not-found. Tools/backend supply the capabilities, not automatic policy enforcement.</desc><defs><marker id="b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#607580" stroke-width="1.3" /></marker></defs><rect width="1000" height="590" fill="white" />
