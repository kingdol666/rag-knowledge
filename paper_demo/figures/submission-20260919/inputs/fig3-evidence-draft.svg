<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="594" viewBox="0 0 1000 594" role="img" aria-labelledby="title desc">
<title id="title">Current Transformer evidence trace and fabricated-paper probe</title><desc id="desc">Current BQ01 only: QDCVR trace evidence maps parts one and two of two, sections 3.2.3 and seven, gate eight of eight. Its declared unread material is the positional formula, training details and benchmark scores. Bare agent self-reports the source file and a more complete formula. The generated answer of the dense reproduction reports parsing and Table 4, then abstains; the logged evidence_docs array is empty. P2 rejects BERT at one of eight, scans five bases and 165 documents, and reports not-found.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#253745"/></marker></defs>
<rect width="1000" height="594" fill="white"/>
<g font-family="Calibri, Carlito, sans-serif"><text x="20" y="26" font-size="21" font-weight="600" fill="#253745" text-anchor="start">BQ01 · How is attention computed, and why replace recurrence and convolution?</text><text x="20" y="49" font-size="17" font-weight="400" fill="#526472" text-anchor="start">Current run · answer summaries and trace labels are paraphrases.</text><rect x="20" y="62" width="312" height="327" rx="3" fill="white" stroke="#c5cfd5"/><rect x="20" y="62" width="312" height="58" rx="3" fill="#e7f3ec" stroke="none"/><text x="34" y="87" font-size="22" font-weight="700" fill="#253745" text-anchor="start">A  QDCVR</text><text x="34" y="110" font-size="19" font-weight="400" fill="#253745" text-anchor="start">Trace evidence</text><rect x="344" y="62" width="312" height="327" rx="3" fill="white" stroke="#c5cfd5"/><rect x="344" y="62" width="312" height="58" rx="3" fill="#eaf2f9" stroke="none"/><text x="358" y="87" font-size="22" font-weight="700" fill="#253745" text-anchor="start">B  Bare agent</text><text x="358" y="110" font-size="19" font-weight="400" fill="#253745" text-anchor="start">Self-reported file source</text><rect x="668" y="62" width="312" height="327" rx="3" fill="white" stroke="#c5cfd5"/><rect x="668" y="62" width="312" height="58" rx="3" fill="#f7efdf" stroke="none"/><text x="682" y="87" font-size="22" font-weight="700" fill="#253745" text-anchor="start">C  Dense RAG</text><text x="682" y="110" font-size="19" font-weight="400" fill="#253745" text-anchor="start">Our reproduction</text><path d="M34,132h38l14,14v71h-52Z" fill="white" stroke="#253745" stroke-width="1.2"/><path d="M72,132v14h14" fill="none" stroke="#253745"/><rect x="43" y="155" width="34" height="10" rx="3" fill="#e7f3ec" stroke="none"/><rect x="43" y="173" width="34" height="10" rx="3" fill="#e7f3ec" stroke="none"/><rect x="43" y="191" width="34" height="10" rx="3" fill="#e7f3ec" stroke="none"/><text x="46" y="164" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="46" y="182" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="46" y="200" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><path d="M98,132h38l14,14v71h-52Z" fill="white" stroke="#253745" stroke-width="1.2"/><path d="M136,132v14h14" fill="none" stroke="#253745"/><rect x="107" y="155" width="34" height="10" rx="3" fill="#e7f3ec" stroke="none"/><rect x="107" y="173" width="34" height="10" rx="3" fill="#e7f3ec" stroke="none"/><rect x="107" y="191" width="34" height="10" rx="3" fill="#e7f3ec" stroke="none"/><text x="110" y="164" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="110" y="182" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="110" y="200" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="165" y="157" font-size="18" font-weight="600" fill="#253745" text-anchor="start">part 1/2 · §3.2.3</text><text x="165" y="185" font-size="18" font-weight="600" fill="#253745" text-anchor="start">part 2/2 · §7</text><path d="M177 219V237" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><text x="190" y="235" font-size="17" font-weight="400" fill="#253745" text-anchor="start">read</text><text x="34" y="260" font-size="20" font-weight="600" fill="#253745" text-anchor="start">Multi-head attention replaces</text><text x="34" y="284" font-size="19" font-weight="400" fill="#253745" text-anchor="start">recurrence; parallel computation.</text><text x="34" y="313" font-size="21" font-weight="600" fill="#253745" text-anchor="start">Gate: 8/8 · fast exit</text><text x="34" y="340" font-size="19" font-weight="400" fill="#253745" text-anchor="start">Unread: positional formula,</text><text x="34" y="363" font-size="18" font-weight="400" fill="#253745" text-anchor="start">training details, benchmark scores.</text><path d="M358,132h42l14,14v71h-56Z" fill="white" stroke="#253745" stroke-width="1.2"/><path d="M400,132v14h14" fill="none" stroke="#253745"/><rect x="367" y="155" width="38" height="10" rx="3" fill="#eaf2f9" stroke="none"/><rect x="367" y="173" width="38" height="10" rx="3" fill="#eaf2f9" stroke="none"/><rect x="367" y="191" width="38" height="10" rx="3" fill="#eaf2f9" stroke="none"/><text x="427" y="158" font-size="20" font-weight="600" fill="#253745" text-anchor="start">1706.03762</text><text x="427" y="185" font-size="19" font-weight="400" fill="#253745" text-anchor="start">files_used: filename</text><path d="M500 219V237" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><text x="513" y="235" font-size="17" font-weight="400" fill="#253745" text-anchor="start">reports</text><text x="358" y="260" font-size="22" font-weight="600" fill="#253745" text-anchor="start">softmax(QKᵀ / √dₖ)V</text><text x="358" y="284" font-size="18" font-weight="400" fill="#253745" text-anchor="start">Multi-head; parallelism; short paths</text><text x="358" y="313" font-size="20" font-weight="600" fill="#253745" text-anchor="start">More complete formula prose</text><text x="358" y="340" font-size="19" font-weight="400" fill="#253745" text-anchor="start">Self-reported source,</text><text x="358" y="363" font-size="19" font-weight="400" fill="#253745" text-anchor="start">not an observed file-read trace.</text><rect x="682" y="136" width="58" height="28" rx="3" fill="#f7efdf" stroke="#c5cfd5"/><text x="711" y="156" font-size="20" font-weight="600" fill="#253745" text-anchor="middle">…</text><rect x="682" y="177" width="58" height="28" rx="3" fill="#f7efdf" stroke="#c5cfd5"/><text x="711" y="197" font-size="20" font-weight="600" fill="#253745" text-anchor="middle">…</text><text x="754" y="157" font-size="19" font-weight="600" fill="#253745" text-anchor="start">C reports: parsing</text><text x="754" y="185" font-size="19" font-weight="400" fill="#253745" text-anchor="start">+ Table 4 results</text><path d="M824 219V237" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><text x="837" y="235" font-size="17" font-weight="400" fill="#253745" text-anchor="start">generate</text><text x="682" y="260" font-size="20" font-weight="600" fill="#253745" text-anchor="start">Reports insufficient evidence</text><text x="682" y="284" font-size="19" font-weight="400" fill="#253745" text-anchor="start">Abstains in the recorded answer.</text><text x="682" y="313" font-size="20" font-weight="600" fill="#253745" text-anchor="start">2 chunks · 2,854 characters</text><text x="682" y="340" font-size="19" font-weight="400" fill="#253745" text-anchor="start">Chunk/source metadata</text><text x="682" y="363" font-size="19" font-weight="400" fill="#253745" text-anchor="start">not logged in this harness.</text><text x="20" y="422" font-size="21" font-weight="600" fill="#253745" text-anchor="start">P2 · Spectral Tuning for Low-Resource Odor Recognition</text><text x="20" y="448" font-size="19" font-weight="400" fill="#253745" text-anchor="start">Fabricated-paper probe: asks about training epochs</text><rect x="20" y="468" width="263" height="86" rx="3" fill="#eaf2f9" stroke="#c5cfd5"/><text x="34" y="494" font-size="21" font-weight="600" fill="#253745" text-anchor="start">BERT near miss</text><text x="34" y="520" font-size="19" font-weight="400" fill="#253745" text-anchor="start">Epochs belong to</text><text x="34" y="543" font-size="19" font-weight="400" fill="#253745" text-anchor="start">a different paper.</text><path d="M283 511H311" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="319" y="468" width="179" height="86" rx="3" fill="#efedf7" stroke="#c5cfd5"/><text x="333" y="495" font-size="21" font-weight="600" fill="#253745" text-anchor="start">Gate: 1/8</text><text x="333" y="523" font-size="19" font-weight="400" fill="#253745" text-anchor="start">Read → reject</text><path d="M498 511H526" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="534" y="468" width="247" height="86" rx="3" fill="#f7efdf" stroke="#c5cfd5"/><text x="548" y="495" font-size="21" font-weight="600" fill="#253745" text-anchor="start">Librarian scan</text><text x="548" y="520" font-size="18" font-weight="400" fill="#253745" text-anchor="start">5 bases · 165 indexed docs</text><text x="548" y="543" font-size="19" font-weight="400" fill="#253745" text-anchor="start">50 papers</text><path d="M781 511H809" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="817" y="468" width="163" height="86" rx="3" fill="#e7f3ec" stroke="#c5cfd5"/><text x="829" y="501" font-size="21" font-weight="700" fill="#253745" text-anchor="start">NOT FOUND</text><text x="829" y="530" font-size="18" font-weight="400" fill="#253745" text-anchor="start">Scope reported</text><text x="20" y="578" font-size="14" font-weight="400" fill="#253745" text-anchor="start">Gate scores: LLM self-assessments, not accuracy.</text></g></svg>