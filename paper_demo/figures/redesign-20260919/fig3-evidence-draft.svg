<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="936" viewBox="0 0 1000 936" role="img" aria-labelledby="title desc">
<title id="title">Transformer evidence trace and fabricated-paper probe</title><desc id="desc">Three columns compare current BQ01: QDCVR current parts one and two of two, sections 3.2.3 and seven, gate eight of eight; bare agent reports a full formula but only self-reported file access; dense reproduction abstains after receiving parsing evidence. A separate historical note records archived seven of eight and an unread exact formula, with different part numbers. P2 rejects BERT at one of eight and scans five bases and 165 documents before not-found.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#253745"/></marker></defs>
<rect width="1000" height="936" fill="white"/>
<g font-family="Calibri, Carlito, sans-serif"><text x="28" y="36" font-size="27" font-weight="700" fill="#253745" text-anchor="start">03  /  What can be traced from an answer?</text><text x="28" y="65" font-size="18" font-weight="400" fill="#253745" text-anchor="start">BQ01 · Attention Is All You Need · selected case, not an accuracy ranking</text><rect x="28" y="84" width="944" height="61" rx="3" fill="#eaf2f9" stroke="#c5cfd5"/><text x="46" y="108" font-size="15" font-weight="700" fill="#253745" text-anchor="start">QUERY · PARAPHRASE</text><text x="46" y="132" font-size="21" font-weight="600" fill="#253745" text-anchor="start">How is attention computed, and why replace recurrence and convolution?</text><rect x="28" y="167" width="300" height="387" rx="3" fill="white" stroke="#c5cfd5"/><rect x="28" y="167" width="300" height="69" rx="3" fill="#e7f3ec" stroke="none"/><text x="45" y="195" font-size="24" font-weight="700" fill="#253745" text-anchor="start">A  QDCVR</text><text x="45" y="222" font-size="18" font-weight="400" fill="#253745" text-anchor="start">Section-addressed evidence</text><rect x="350" y="167" width="300" height="387" rx="3" fill="white" stroke="#c5cfd5"/><rect x="350" y="167" width="300" height="69" rx="3" fill="#eaf2f9" stroke="none"/><text x="367" y="195" font-size="24" font-weight="700" fill="#253745" text-anchor="start">B  Bare agent</text><text x="367" y="222" font-size="18" font-weight="400" fill="#253745" text-anchor="start">Self-reported file source</text><rect x="672" y="167" width="300" height="387" rx="3" fill="white" stroke="#c5cfd5"/><rect x="672" y="167" width="300" height="69" rx="3" fill="#f7efdf" stroke="none"/><text x="689" y="195" font-size="24" font-weight="700" fill="#253745" text-anchor="start">C  Dense RAG</text><text x="689" y="222" font-size="18" font-weight="400" fill="#253745" text-anchor="start">Our reproduction</text><path d="M45,251h48l14,14v74h-62Z" fill="white" stroke="#253745" stroke-width="1.2"/><path d="M93,251v14h14" fill="none" stroke="#253745"/><rect x="54" y="274" width="44" height="10" rx="3" fill="#e7f3ec" stroke="none"/><rect x="54" y="292" width="44" height="10" rx="3" fill="#e7f3ec" stroke="none"/><rect x="54" y="310" width="44" height="10" rx="3" fill="#e7f3ec" stroke="none"/><text x="57" y="283" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="57" y="301" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="57" y="319" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><path d="M118,251h48l14,14v74h-62Z" fill="white" stroke="#253745" stroke-width="1.2"/><path d="M166,251v14h14" fill="none" stroke="#253745"/><rect x="127" y="274" width="44" height="10" rx="3" fill="#e7f3ec" stroke="none"/><rect x="127" y="292" width="44" height="10" rx="3" fill="#e7f3ec" stroke="none"/><rect x="127" y="310" width="44" height="10" rx="3" fill="#e7f3ec" stroke="none"/><text x="130" y="283" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="130" y="301" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="130" y="319" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="193" y="275" font-size="17" font-weight="600" fill="#253745" text-anchor="start">part 1/2</text><text x="193" y="300" font-size="18" font-weight="600" fill="#253745" text-anchor="start">§3.2.3</text><text x="193" y="324" font-size="16" font-weight="600" fill="#253745" text-anchor="start">part 2/2 · §7</text><path d="M174 344V372" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><text x="189" y="362" font-size="16" font-weight="400" fill="#253745" text-anchor="start">read</text><text x="45" y="399" font-size="20" font-weight="600" fill="#253745" text-anchor="start">Multi-head applications;</text><text x="45" y="424" font-size="18" font-weight="400" fill="#253745" text-anchor="start">attention replaces recurrence.</text><text x="45" y="459" font-size="19" font-weight="600" fill="#253745" text-anchor="start">Current gate: 8/8 · fast exit</text><text x="45" y="490" font-size="17" font-weight="400" fill="#253745" text-anchor="start">Base → document → part → §</text><text x="45" y="522" font-size="17" font-weight="400" fill="#253745" text-anchor="start">Blind spot: positional formula</text><text x="45" y="543" font-size="17" font-weight="400" fill="#253745" text-anchor="start">and training details not read.</text><path d="M367,251h56l14,14v74h-70Z" fill="white" stroke="#253745" stroke-width="1.2"/><path d="M423,251v14h14" fill="none" stroke="#253745"/><rect x="376" y="274" width="52" height="10" rx="3" fill="#eaf2f9" stroke="none"/><rect x="376" y="292" width="52" height="10" rx="3" fill="#eaf2f9" stroke="none"/><rect x="376" y="310" width="52" height="10" rx="3" fill="#eaf2f9" stroke="none"/><text x="453" y="276" font-size="19" font-weight="600" fill="#253745" text-anchor="start">1706.03762</text><text x="453" y="302" font-size="16" font-weight="400" fill="#253745" text-anchor="start">filename in files_used</text><path d="M498 344V372" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><text x="513" y="362" font-size="16" font-weight="400" fill="#253745" text-anchor="start">reports</text><text x="367" y="399" font-size="22" font-weight="600" fill="#253745" text-anchor="start">softmax(QKᵀ / √dₖ)V</text><text x="367" y="427" font-size="19" font-weight="400" fill="#253745" text-anchor="start">Multi-head projection;</text><text x="367" y="451" font-size="19" font-weight="400" fill="#253745" text-anchor="start">parallelism + shorter paths.</text><text x="367" y="490" font-size="18" font-weight="600" fill="#253745" text-anchor="start">More complete formula prose</text><text x="367" y="522" font-size="17" font-weight="400" fill="#253745" text-anchor="start">File claim, not an observed</text><text x="367" y="543" font-size="17" font-weight="400" fill="#253745" text-anchor="start">file-read audit trail.</text><rect x="689" y="256" width="74" height="30" rx="3" fill="#f7efdf" stroke="#c5cfd5"/><text x="726" y="277" font-size="20" font-weight="600" fill="#253745" text-anchor="middle">…</text><rect x="689" y="298" width="74" height="30" rx="3" fill="#f7efdf" stroke="#c5cfd5"/><text x="726" y="319" font-size="20" font-weight="600" fill="#253745" text-anchor="middle">…</text><text x="779" y="277" font-size="17" font-weight="600" fill="#253745" text-anchor="start">Parsing experiments</text><text x="779" y="303" font-size="17" font-weight="400" fill="#253745" text-anchor="start">+ Table 4 results</text><path d="M820 344V372" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><text x="835" y="362" font-size="16" font-weight="400" fill="#253745" text-anchor="start">generate</text><text x="689" y="399" font-size="19" font-weight="600" fill="#253745" text-anchor="start">Abstains: insufficient evidence</text><text x="689" y="427" font-size="19" font-weight="400" fill="#253745" text-anchor="start">Evidence window lacks</text><text x="689" y="451" font-size="19" font-weight="400" fill="#253745" text-anchor="start">the requested method.</text><text x="689" y="490" font-size="18" font-weight="600" fill="#253745" text-anchor="start">2 chunks · 2,854 characters</text><text x="689" y="522" font-size="17" font-weight="400" fill="#253745" text-anchor="start">Chunk/source metadata</text><text x="689" y="543" font-size="17" font-weight="400" fill="#253745" text-anchor="start">not logged by this harness.</text><rect x="28" y="571" width="944" height="76" rx="3" fill="#efedf7" stroke="#c5cfd5"/><text x="44" y="595" font-size="15" font-weight="700" fill="#253745" text-anchor="start">RUN BOUNDARY</text><text x="190" y="595" font-size="18" font-weight="600" fill="#253745" text-anchor="start">Archived BQ01: gate 7/8; exact attention formula outside read windows.</text><text x="44" y="619" font-size="17" font-weight="400" fill="#253745" text-anchor="start">That trace cites parts 11/26 + 25/26, not the current 1/2 + 2/2. Do not merge the runs.</text><text x="44" y="640" font-size="17" font-weight="400" fill="#253745" text-anchor="start">Chunking is a possible explanation for C, not a proved cause; ranks were not logged.</text><text x="28" y="680" font-size="23" font-weight="700" fill="#253745" text-anchor="start">P2  /  A plausible near miss is still not evidence</text><text x="28" y="707" font-size="20" font-weight="600" fill="#253745" text-anchor="start">Fabricated-paper probe · Spectral Tuning for Low-Resource Odor Recognition</text><text x="28" y="732" font-size="17" font-weight="400" fill="#253745" text-anchor="start">Asked for training epochs; the following is a paraphrase of the recorded rejection trace.</text><rect x="28" y="752" width="267" height="98" rx="3" fill="#eaf2f9" stroke="#c5cfd5"/><path d="M43,768h29l14,14v48h-43Z" fill="white" stroke="#253745" stroke-width="1.2"/><path d="M72,768v14h14" fill="none" stroke="#253745"/><rect x="52" y="791" width="25" height="10" rx="3" fill="#eaf2f9" stroke="none"/><rect x="52" y="809" width="25" height="10" rx="3" fill="#eaf2f9" stroke="none"/><text x="99" y="779" font-size="21" font-weight="600" fill="#253745" text-anchor="start">BERT near miss</text><text x="99" y="805" font-size="17" font-weight="400" fill="#253745" text-anchor="start">Epoch strings belong</text><text x="99" y="829" font-size="17" font-weight="400" fill="#253745" text-anchor="start">to a different paper.</text><path d="M295 801H330" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="339" y="752" width="180" height="98" rx="3" fill="#efedf7" stroke="#c5cfd5"/><text x="357" y="780" font-size="22" font-weight="600" fill="#253745" text-anchor="start">Gate: 1/8</text><text x="357" y="808" font-size="18" font-weight="400" fill="#253745" text-anchor="start">Read → reject</text><text x="357" y="832" font-size="17" font-weight="400" fill="#253745" text-anchor="start">wrong paper</text><path d="M519 801H554" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="563" y="752" width="212" height="98" rx="3" fill="#f7efdf" stroke="#c5cfd5"/><text x="581" y="780" font-size="21" font-weight="600" fill="#253745" text-anchor="start">Librarian scan</text><text x="581" y="808" font-size="18" font-weight="400" fill="#253745" text-anchor="start">5 bases · 165 docs</text><text x="581" y="832" font-size="17" font-weight="400" fill="#253745" text-anchor="start">50 papers</text><path d="M775 801H810" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="819" y="752" width="153" height="98" rx="3" fill="#e7f3ec" stroke="#c5cfd5"/><text x="834" y="789" font-size="20" font-weight="700" fill="#253745" text-anchor="start">NOT FOUND</text><text x="834" y="817" font-size="16" font-weight="400" fill="#253745" text-anchor="start">scope reported</text><text x="28" y="888" font-size="16" font-weight="400" fill="#253745" text-anchor="start">Scope: current 30k run + explicitly separated archived caveat; prose is paraphrased, not quoted.</text><text x="28" y="913" font-size="16" font-weight="400" fill="#253745" text-anchor="start">Scores are self-assessments. This case compares traceability, not independently judged accuracy.</text></g></svg>