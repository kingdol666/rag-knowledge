none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="40" y="246" width="428" height="59" rx="3" fill="#eaf2f9" stroke="#c5cfd5"/><text x="56" y="270" font-size="21" font-weight="600" fill="#253745" text-anchor="start">Dense retrieval → top 2</text><text x="56" y="295" font-size="20" font-weight="400" fill="#253745" text-anchor="start">4,000-char evidence window</text><path d="M254 305V324" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="40" y="330" width="428" height="40" rx="3" fill="#efedf7" stroke="#c5cfd5"/><text x="56" y="357" font-size="21" font-weight="600" fill="#253745" text-anchor="start">Single generation → answer</text><text x="40" y="400" font-size="20" font-weight="400" fill="#253745" text-anchor="start">Provenance not logged in this harness.</text><path d="M532,140h43l14,14v71h-57Z" fill="white" stroke="#253745" stroke-width="1.2"/><path d="M575,140v14h14" fill="none" stroke="#253745"/><rect x="541" y="163" width="39" height="10" rx="3" fill="#e7f3ec" stroke="none"/><rect x="541" y="181" width="39" height="10" rx="3" fill="#e7f3ec" stroke="none"/><rect x="541" y="199" width="39" height="10" rx="3" fill="#e7f3ec" stroke="none"/><text x="544" y="172" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="544" y="190" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="544" y="208" font-size="14" font-weight="600" fill="#253745" text-anchor="start">§</text><text x="607" y="168" font-size="20" font-weight="600" fill="#253745" text-anchor="start">Organized, section-addressed parts</text><text x="607" y="198" font-size="19" font-weight="400" fill="#253745" text-anchor="start">base / document / part / section</text><path d="M746 226V240" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="532" y="246" width="428" height="59" rx="3" fill="#e7f3ec" stroke="#c5cfd5"/><text x="548" y="270" font-size="21" font-weight="600" fill="#253745" text-anchor="start">Vector-first recall</text><text x="548" y="295" font-size="20" font-weight="400" fill="#253745" text-anchor="start">Read candidate text; score 0–8</text><path d="M746 305V324" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M746 330L842 363L746 396L650 363Z" fill="#e7f3ec" stroke="#253745"/><text x="746" y="370" font-size="21" font-weight="600" fill="#253745" text-anchor="middle">Gate ≥ 6?</text><path d="M650 363H615V435H426V458" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><text x="546" y="430" font-size="19" font-weight="600" fill="#253745" text-anchor="start">pass</text><path d="M842 363H935V458" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/><text x="941" y="434" font-size="19" font-weight="600" fill="#253745" text-anchor="start">fail</text><rect x="20" y="464" width="468" height="77" rx="3" fill="#e7f3ec" stroke="#c5cfd5"/><text x="36" y="494" font-size="22" font-weight="600" fill="#253745" text-anchor="start">Cited answer + declared blind spots</text><text x="36" y="522" font-size="20" font-weight="400" fill="#253745" text-anchor="start">Section-addressed sources</text><rect x="528" y="464" width="452" height="77" rx="3" fill="#f7efdf" stroke="#c5cfd5"/><text x="544" y="494" font-size="21" font-weight="600" fill="#253745" text-anchor="start">Librarian fallback → read + recheck</text><text x="544" y="522" font-size="20" font-weight="400" fill="#253745" text-anchor="start">Pass → cited answer; fail → not-found</text><path d="M528 503H493" fill="none" stroke="#253745" stroke-width="1.4" marker-end="url(#arrow)"/></g></svg><figcaption>Draft Figure 1. Process comparison for the same NISQ query (BQ02). Dense RAG denotes our reproduction: 800-character fixed chunks, top-2 retrieval, a 4,000-character evidence window and one generation call. Missing provenance is a harness logging limitation, not an intrinsic property of dense retrieval. QDCVR recalls organized, section-addressed evidence, reads candidates against a 0–8 rubric, and passes at ≥6; failure invokes librarian fallback and rechecking before a cited answer or a scoped not-found report. The diagram describes control flow, not measured superiority. Gate scores are execution-LLM self-assessments. Original manuscript caption must be corrected after approval; the manuscript is unchanged.</figcaption></html>
