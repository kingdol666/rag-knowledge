<title id="title">NISQ retrieval-process comparison</title><desc id="desc">Both processes receive BQ02. Reproduced dense RAG uses 800-character chunks, top two retrieval, a 4000-character window, and single generation. Its harness does not log provenance. QDCVR reads section-addressed candidates, passes at six of eight, or falls back to a librarian and rechecks before a cited answer or not-found report.</desc>
