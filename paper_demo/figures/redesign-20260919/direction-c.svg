<rect x="30" y="164" width="940" height="40" rx="3" fill="#edf5ef" stroke="#607580" stroke-width="1.1"/>
<text x="500.0" y="189.44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#263944">FastAPI backend / shared platform services</text>
