<text x="30" y="1213" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#607580">Solid arrows: data / control flow. Dashed arrows: evidence supply. Dashed modules: optional.</text></svg>