<svg xmlns="http://www.w3.org/2000/svg" xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562" role="img" aria-labelledby="title desc"><title id="title">QDCVR at a glance</title><desc id="desc">Left, subordinate gray: a conventional dense-RAG configuration - fixed 800-character chunks, dense retrieval of the top two excerpts, a packed context of at most 4,000 characters, single generation; the reader gets an answer without citations, sources it cannot address, and retrieval errors that pass through silently; provenance is not logged. Right, hero: QDCVR, an agent-executed skill running two loops over one store. Loop one manages the knowledge base autonomously: PDF, parse with MinerU, route by content, tag, index as parts - every part carries a layered address (base Computer Science and AI; document attention-is-all-you-need.md; part 1 of 2; section 3.2.1 Scaled Dot-Product Attention). Loop two retrieves librarian-style: query rewrite, cross-base vector recall, read the candidates, then a 0-8 content rubric gate; gate at least six yields a cited answer with section-addressed sources, gate below six sends the librarian to browse base summaries and tag-matched shelves, ending in a qualified answer with attribution or a scoped not-found report. The invariant: one set of base, document, part, section addresses powers both loops, so every answer can be checked at its source. The left lane is shown for contrast; the evaluated dense variant is specified in Table 1.</desc><g font-family="Calibri, Carlito, sans-serif"><rect width="1000" height="562" fill="white" /><text x="20" y="26" font-size="21" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">QDCVR at a glance: from raw PDFs to inspectable answers</text><text x="20" y="48" font-size="14.5" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">One store, two agent loops - content-guided management and librarian-style retrieval share the same section addresses</text><rect x="20" y="58" width="330" height="446" rx="4" fill="#fbfcfd" stroke="#c5cfd5" /><rect x="20" y="64" width="330" height="44" rx="3" fill="#eef1f4" /><g><rect x="32" y="72" width="15" height="19" rx="1.5" fill="none" stroke="#6c86a8" stroke-width="1.8" /><path d="M35 77h9 M35 81h9 M35 85h6" stroke="#6c86a8" stroke-width="1.6" /></g><text x="56" y="80" font-size="15" font-weight="700" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">Conventional dense RAG</text><text x="56" y="96" font-size="13.5" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">pack-then-generate</text><g><rect x="34" y="122" width="302" height="36" rx="4" fill="#f7fafd" stroke="#c5cfd5" /><text x="185.0" y="144.32" font-size="13.5" font-weight="400" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">Fixed chunks (about 800 characters)</text></g><path d="M185.0 158V172" stroke="#253745" stroke-width="1.3" fill="none" marker-end="url(#arrow)" /><g><rect x="34" y="172" width="302" height="36" rx="4" fill="#f7fafd" stroke="#c5cfd5" /><text x="185.0" y="194.32" font-size="13.5" font-weight="400" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">Dense retrieval, top-2 excerpts</text></g><path d="M185.0 208V222" stroke="#253745" stroke-width="1.3" fill="none" marker-end="url(#arrow)" /><g><rect x="34" y="222" width="302" height="36" rx="4" fill="#f7fafd" stroke="#c5cfd5" /><text x="185.0" y="244.32" font-size="13.5" font-weight="400" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">Pack a 4,000-char context</text></g><path d="M185.0 258V272" stroke="#253745" stroke-width="1.3" fill="none" marker-end="url(#arrow)" /><g><rect x="34" y="272" width="302" height="36" rx="4" fill="#f7fafd" stroke="#c5cfd5" /><text x="185.0" y="294.32" font-size="13.5" font-weight="400" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">Single generation, one answer</text></g><rect x="34" y="322" width="302" height="86" rx="3" fill="white" stroke="#c5cfd5" /><text x="46" y="340" font-size="12.5" font-weight="700" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">WHAT A READER GETS</text><text x="46" y="360" font-size="13" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">- an answer, no citations required</text><text x="46" y="376" font-size="13" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">- sources it cannot address</text><text x="46" y="392" font-size="13" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">- retrieval errors pass through</text><g><rect x="34" y="420" width="302" height="30" rx="4" fill="white" stroke="#bf4b28" /><text x="185.0" y="439.16" font-size="13" font-weight="600" fill="#bf4b28" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">provenance not logged in this harness</text></g><text x="34" y="470" font-size="13" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">shown for contrast;</text><text x="34" y="486" font-size="13" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">not the evaluated configuration</text><rect x="368" y="58" width="612" height="446" rx="4" fill="#f7fbf9" stroke="#2f7d5f" stroke-width="1.6" /><rect x="368" y="64" width="612" height="44" rx="3" fill="#e7f3ec" /><g><path d="M380 76l11 -7 11 7z" fill="#2f7d5f" /><rect x="380" y="76" width="22" height="2.2" fill="#2f7d5f" /><rect x="383" y="79" width="3.2" height="8" fill="#2f7d5f" /><rect x="389.4" y="79" width="3.2" height="8" fill="#2f7d5f" /><rect x="395.8" y="79" width="3.2" height="8" fill="#2f7d5f" /><rect x="380" y="87.5" width="22" height="2.2" fill="#2f7d5f" /></g><text x="412" y="80" font-size="16" font-weight="700" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">QDCVR - agent-executed skill</text><text x="412" y="98" font-size="13.5" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">manage and retrieve in one loop</text><rect x="382" y="116" width="584" height="64" rx="3" fill="#f4faf7" stroke="#c5cfd5" /><g><circle cx="402" cy="132" r="4.6" fill="none" stroke="#2f7d5f" stroke-width="2" /><circle cx="402" cy="132" r="1.4" fill="#2f7d5f" /><rect x="400.8" y="123.8" width="2.4" height="2.4" fill="#2f7d5f" /><rect x="400.8" y="137.8" width="2.4" height="2.4" fill="#2f7d5f" /><rect x="393.8" y="130.8" width="2.4" height="2.4" fill="#2f7d5f" /><rect x="407.8" y="130.8" width="2.4" height="2.4" fill="#2f7d5f" /></g><text x="420" y="138" font-size="13.5" font-weight="700" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">LOOP 1 - MANAGE: autonomous ingest</text><g><rect x="394" y="148" width="44" height="26" rx="4" fill="#e7f3ec" stroke="#c5cfd5" /><text x="416.0" y="165.0" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">PDF</text></g><g><rect x="444" y="148" width="96" height="26" rx="4" fill="#e7f3ec" stroke="#c5cfd5" /><text x="492.0" y="165.0" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">parse (MinerU)</text></g><g><rect x="546" y="148" width="112" height="26" rx="4" fill="#e7f3ec" stroke="#c5cfd5" /><text x="602.0" y="165.0" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">route by content</text></g><g><rect x="664" y="148" width="42" height="26" rx="4" fill="#e7f3ec" stroke="#c5cfd5" /><text x="685.0" y="165.0" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">tag</text></g><g><rect x="712" y="148" width="96" height="26" rx="4" fill="#e7f3ec" stroke="#c5cfd5" /><text x="760.0" y="165.0" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">index as parts</text></g><text x="382" y="200" font-size="12.5" font-weight="700" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">EVERY PART CARRIES A LAYERED ADDRESS</text><rect x="382" y="208" width="584" height="17" rx="2" fill="#e7f3ec" stroke="#c5cfd5" /><text x="390" y="221" font-size="12.5" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">base &gt; Computer Science &amp; AI</text><rect x="398" y="227" width="568" height="17" rx="2" fill="#d9ede4" stroke="#c5cfd5" /><text x="406" y="240" font-size="12.5" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">document &gt; attention-is-all-you-need.md</text><rect x="414" y="246" width="552" height="17" rx="2" fill="#c8e3d6" stroke="#c5cfd5" /><text x="422" y="259" font-size="12.5" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">part &gt; 1 of 2</text><rect x="430" y="265" width="536" height="17" rx="2" fill="#b5d9c8" stroke="#c5cfd5" /><text x="438" y="278" font-size="12.5" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">section &gt; 3.2.1 Scaled Dot-Product Attention</text><rect x="382" y="296" width="584" height="168" rx="3" fill="#fcf9f2" stroke="#c5cfd5" /><g><circle cx="401" cy="310" r="5.6" fill="none" stroke="#c09a4e" stroke-width="1.8" /><path d="M405.5 314.5l5 5" stroke="#c09a4e" stroke-width="2.2" /></g><text x="420" y="318" font-size="13.5" font-weight="700" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">LOOP 2 - RETRIEVE: librarian-style, content-gated</text><g><rect x="394" y="330" width="132" height="28" rx="4" fill="#f7efdf" stroke="#c5cfd5" /><text x="460.0" y="348.0" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">query rewrite</text></g><g><rect x="536" y="330" width="162" height="28" rx="4" fill="#f7efdf" stroke="#c5cfd5" /><text x="617.0" y="348.0" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">vector recall (cross-base)</text></g><g><rect x="708" y="330" width="140" height="28" rx="4" fill="#f7efdf" stroke="#c5cfd5" /><text x="778.0" y="348.0" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">read the candidates</text></g><path d="M526 344H536" stroke="#253745" stroke-width="1.3" fill="none" marker-end="url(#arrow)" /><path d="M698 344H708" stroke="#253745" stroke-width="1.3" fill="none" marker-end="url(#arrow)" /><g><rect x="394" y="368" width="214" height="40" rx="4" fill="#f7efdf" stroke="#c5cfd5" /><text x="501.0" y="384.25" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">content gate 0-8</text><text x="501.0" y="399.75" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">(topic + scenario + evidence)</text></g><path d="M778 358V362H501V368" stroke="#253745" stroke-width="1.3" fill="none" marker-end="url(#arrow)" /><text x="620" y="382" font-size="13.5" font-weight="700" fill="#2f7d5f" text-anchor="start" font-family="Calibri, Carlito, sans-serif">gate at least 6: cited answer</text><text x="620" y="398" font-size="13" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">section-addressed sources</text><text x="394" y="422" font-size="13.5" font-weight="700" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">gate below 6: librarian browses</text><text x="578" y="422" font-size="13" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">base summaries + tag-matched shelves, re-check</text><g><rect x="394" y="432" width="122" height="26" rx="4" fill="#e7f3ec" stroke="#c5cfd5" /><text x="455.0" y="449.0" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">cited (P0 at least 6)</text></g><g><rect x="524" y="432" width="168" height="26" rx="4" fill="#efedf7" stroke="#c5cfd5" /><text x="608.0" y="449.0" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">qualified (P1 = 5, attributed)</text></g><g><rect x="700" y="432" width="148" height="26" rx="4" fill="#f7efdf" stroke="#c5cfd5" /><text x="774.0" y="449.0" font-size="12.5" font-weight="600" fill="#253745" text-anchor="middle" font-family="Calibri, Carlito, sans-serif">not found (scoped)</text></g><rect x="368" y="512" width="612" height="40" rx="3" fill="#f4faf7" stroke="#2f7d5f" /><text x="382" y="528" font-size="14" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">The invariant: one set of base / document / part / section addresses powers both loops,</text><text x="382" y="546" font-size="14" font-weight="600" fill="#253745" text-anchor="start" font-family="Calibri, Carlito, sans-serif">so every answer can be checked at its source.</text><text x="20" y="518" font-size="13.5" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">Left lane: conventional dense RAG, shown for contrast;</text><text x="20" y="534" font-size="13.5" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">the evaluated dense variant is specified in Table 1.</text><text x="20" y="550" font-size="13.5" font-weight="400" fill="#526472" text-anchor="start" font-family="Calibri, Carlito, sans-serif">Scores are agent judgments, not accuracy measurements.</text></g><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#253745" /></marker></defs></svg>