<svg xmlns="http://www.w3.org/2000/svg" xmlns="http://www.w3.org/2000/svg" width="1000" height="684" viewBox="0 0 1000 684" role="img" aria-labelledby="title desc"><title id="title">Two questions answered under three retrieval modes</title><desc id="desc">Verbatim answer excerpts, saved tool timelines, and source references from the monitored three-mode run over the 100-paper corpus; all modes used the same agent harness, model, chat endpoint, and neutral prompt. Panel 1 (BQ04): all three modes answer the Gene Ontology question; the platform quotes the source passage verbatim and addresses it as part 1 of 2, section 2; the bare agent names the file; the dense mode quotes the chunk copy. Panel 2 (BQ06): the platform refines its search, has the judgment engine grade candidate segments, and returns a keyword-verified answer quoting the source; the dense mode reaches the same factor from chunk recollection alone, with no grading step and no addresses. Ellipses elide text; markdown emphasis removed; source lines condensed.</desc><g font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif"><rect width="1000" height="700" fill="white" /><text x="20" y="20" font-size="15.5" font-weight="600" fill="#526472" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">QUESTION BQ04 · Which three independent ontologies subdivide the Gene Ontology?</text><rect x="20" y="32" width="308" height="38" rx="4" fill="#e6f3ec" stroke="#c5cfd5" /><g><path d="M32 42l11 -7 11 7z" fill="#253745" /><rect x="32" y="42" width="22" height="2.2" fill="#253745" /><rect x="35" y="45" width="3.2" height="8" fill="#253745" /><rect x="41.4" y="45" width="3.2" height="8" fill="#253745" /><rect x="47.8" y="45" width="3.2" height="8" fill="#253745" /><rect x="32" y="53.5" width="22" height="2.2" fill="#253745" /></g><text x="62" y="50" font-size="15" font-weight="700" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-