ght="400" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">non-redundant ontologies representing</text><text x="356" y="251" font-size="15" font-weight="400" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">different biological aspects: Molecular</text><text x="356" y="268" font-size="15" font-weight="400" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">Function (MF), Biological Process (BP),</text><text x="356" y="285" font-size="15" font-weight="400" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">and Cellular Component (CC).”</text><path d="M356,291 H644" stroke="#dbe3e8" stroke-width="1" /><text x="356" y="306" font-size="15" font-weight="600" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">Source: …1602.01876__primer-</text><text x="356" y="322" font-size="15" font-weight="600" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">on-the-gene-ontology.md</text><text x="356" y="340" font-size="15" font-weight="600" fill="#52615c" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">grounded ✓ · file + section name</text><rect x="672" y="78" width="308" height="267" rx="4" fill="#fbf8f0" stroke="#c5cfd5" /><text x="682" y="95" font-size="15" font-weight="700" fill="#526472" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">HOW IT SEARCHED — TIMELINE</text><circle cx="686" cy="107" r="2.4" fill="#a07d3a" /><text x="695" y="112" font-size="15" font-weight="400" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">EndConversation ×1 — harness call</text><circle cx="686" cy="124" r="2.4" fill="#a07d3a" /><text x="695" y="