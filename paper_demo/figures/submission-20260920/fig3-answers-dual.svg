art" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">Agent ×1 — subagent probe</text><circle cx="34" cy="124" r="2.4" fill="#1f7a5c" /><text x="43" y="129" font-size="15" font-weight="400" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">kb_search_vector ×1 — recall</text><circle cx="34" cy="141" r="2.4" fill="#1f7a5c" /><text x="43" y="146" font-size="15" font-weight="400" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">kb_search ×1 — cross-check</text><circle cx="34" cy="158" r="2.4" fill="#1f7a5c" /><text x="43" y="163" font-size="15" font-weight="400" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">kb_doc_read ×2 — chunk + part</text><path d="M30,169 H318" stroke="#dbe3e8" stroke-width="1" /><text x="30" y="183" font-size="15" font-weight="700" fill="#526472" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">VERBATIM ANSWER EXCERPT</text><text x="30" y="200" font-size="15" font-weight="400" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">“…Molecular Function (MF), Biological</text><text x="30" y="217" font-size="15" font-weight="400" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">Process (BP), and Cellular Component</text><text x="30" y="234" font-size="15" font-weight="400" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">(CC).”</text><path d="M30,291 H318" stroke="#dbe3e8" stroke-width="1" /><text x="30" y="306" font-size="15" font-weight="600" fill="#253745" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, Segoe UI, sans-serif">Sources: life-sciences base · 1602.01876</text><text x="30" y="322" font-size="15" font-weight="600" fill="#253745" text-anchor=