<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="RAG Knowledge Platform — enterprise document intelligence and agentic knowledge base">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241d16"/>
      <stop offset="55%" stop-color="#1a1612"/>
      <stop offset="100%" stop-color="#211a13"/>
    </linearGradient>
    <radialGradient id="hwarm" cx="0.14" cy="0.30" r="0.70">
      <stop offset="0%" stop-color="#b24422" stop-opacity="0.32"/>
      <stop offset="52%" stop-color="#9e7a38" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a1612" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hcool" cx="0.96" cy="0.86" r="0.60">
      <stop offset="0%" stop-color="#c49846" stop-opacity="0.18"/>
      <stop offset="62%" stop-color="#2e5d7f" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1a1612" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c49846" stop-opacity="0"/>
      <stop offset="16%" stop-color="#c49846" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#b24422" stop-opacity="0.95"/>
      <stop offset="84%" stop-color="#c49846" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c49846" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#c49846" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="hmshadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#000000" flood-opacity="0.50"/>
    </filter>
    <clipPath id="hclip"><rect width="1280" height="380"/></clipPath>
  </defs>

  <g clip-path="url(#hclip)">
    <rect width="1280" height="380" fill="url(#hbg)"/>
    <rect width="1280" height="380" fill="url(#hgrid)"/>
    <rect width="1280" height="380" fill="url(#hwarm)"/>
    <rect width="1280" height="380" fill="url(#hcool)"/>
    <rect x="0" y="0" width="1280" height="2" fill="url(#hrule)"/>
    <rect x="0" y="378" width="1280" height="2" fill="url(#hrule)" opacity="0.45"/>

    <!-- oversized watermark, intentionally bleeding off-canvas -->
    <g transform="translate(1150,300)" opacity="0.10">
      <circle cx="0" cy="0" r="150" fill="none" stroke="#e8c878" stroke-width="16"/>
      <circle cx="-128" cy="76" r="150" fill="none" stroke="#e0553a" stroke-width="16"/>
      <circle cx="128" cy="76" r="150" fill="none" stroke="#c49846" stroke-width="16"/>
    </g>

    <!-- corner filigree -->
    <g stroke="#c49846" stroke-opacity="0.28" fill="none" stroke-width="1.4" stroke-linecap="round">
      <path d="M34 44 h32 M34 44 v32"/>
      <path d="M1246 44 h-32 M1246 44 v32"/>
      <path d="M34 336 h32 M34 336 v-32"/>
    </g>
  </g>

  <!-- left plinth: the triquetra mark -->
  <g transform="translate(150,192)">
    <rect x="-72" y="-72" width="144" height="144" rx="40" fill="#f0e6d6" fill-opacity="0.05"
          stroke="#c49846" stroke-opacity="0.30" stroke-width="1.4"/>
    <circle cx="0" cy="-6" r="36" fill="none" stroke="#e8c878" stroke-opacity="0.62" stroke-width="3.6"/>
    <circle cx="-31" cy="24" r="36" fill="none" stroke="#b24422" stroke-opacity="0.85" stroke-width="3.6"/>
    <circle cx="31" cy="24" r="36" fill="none" stroke="#c49846" stroke-opacity="0.72" stroke-width="3.6"/>
    <circle cx="0" cy="14" r="7.5" fill="#fefcf6"/>
    <circle cx="0" cy="14" r="7.5" fill="none" stroke="#9e7a38" stroke-width="1.8"/>
  </g>

  <!-- vertical hairline separating the plinth column from the content column -->
  <path d="M258 74 V306" stroke="#c49846" stroke-opacity="0.22" stroke-width="1"/>

  <!-- wordmark -->
  <text x="296" y="128" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="50" font-weight="600"
        fill="#f6efe2" letter-spacing="0.3">RAG Knowledge Platform</text>

  <path d="M298 146 h158" stroke="#c49846" stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M468 146 h330" stroke="#c49846" stroke-opacity="0.18" stroke-width="1.6" stroke-linecap="round"/>

  <text x="298" y="176" font-family="'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17.5" font-weight="500"
        fill="#d8c9b0">Enterprise document intelligence &amp; agentic knowledge base</text>

  <text x="298" y="206" font-family="'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5"
        fill="#a6967f">PDF in, verified answer out — retrieval that reads the document</text>
  <text x="298" y="225" font-family="'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5"
        fill="#a6967f">instead of trusting a cosine score.</text>

  <!-- capability chips -->
  <g font-family="'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(298,256)">
      <rect width="158" height="32" rx="16" fill="#b24422" fill-opacity="0.22" stroke="#e0553a" stroke-opacity="0.66"/>
      <circle cx="17" cy="16" r="3.4" fill="#f0674a"/>
      <text x="31" y="20.5" fill="#f6d9cf">QDCVR retrieval</text>
    </g>
    <g transform="translate(464,256)">
      <rect width="134" height="32" rx="16" fill="#9e7a38" fill-opacity="0.18" stroke="#c49846" stroke-opacity="0.60"/>
      <circle cx="17" cy="16" r="3.4" fill="#e8c878"/>
      <text x="31" y="20.5" fill="#eddcbb">Neo4j graph</text>
    </g>
    <g transform="translate(606,256)">
      <rect width="192" height="32" rx="16" fill="#2e5d7f" fill-opacity="0.26" stroke="#58a6ff" stroke-opacity="0.52"/>
      <circle cx="17" cy="16" r="3.4" fill="#7fb8e8"/>
      <text x="31" y="20.5" fill="#cfe2f2">MinerU OCR · 4 formats</text>
    </g>
    <g transform="translate(806,256)">
      <rect width="144" height="32" rx="16" fill="#3d6e3d" fill-opacity="0.22" stroke="#3fb950" stroke-opacity="0.50"/>
      <circle cx="17" cy="16" r="3.4" fill="#5cc46a"/>
      <text x="31" y="20.5" fill="#cfe6cf">MCP · 94 tools</text>
    </g>
  </g>
</svg>
