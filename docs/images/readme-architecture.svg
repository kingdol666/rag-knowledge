<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-label="Platform architecture: clients, services, MCP tool layer, storage">
  <defs>
    <linearGradient id="apaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/><stop offset="100%" stop-color="#f6efe2"/>
    </linearGradient>
    <linearGradient id="aink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33291f"/><stop offset="100%" stop-color="#241c15"/>
    </linearGradient>
    <marker id="aout" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9a583"/>
    </marker>
    <marker id="aoutw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d8c090"/>
    </marker>
    <filter id="ashadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#554128" flood-opacity="0.16"/>
    </filter>
    <filter id="ashadowdk" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#2a1f15" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1280" height="620" fill="url(#apaper)"/>
  <rect x="0" y="0" width="1280" height="3" fill="#c49846" fill-opacity="0.55"/>

  <g font-family="'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="40" y="50" font-family="Cormorant Garamond, Georgia, serif" font-size="27" font-weight="600" fill="#2a1f15">
      Architecture — one backend, four interfaces, three storage engines
    </text>
    <text x="40" y="74" font-size="13" fill="#766551">
      Every module reads its ports and paths from a single config.yml. Nothing is hardcoded.
    </text>
  </g>

  <!-- ================= COLUMN 1 · CLIENTS ================= -->
  <g font-family="'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="40" y="112" font-size="11" font-weight="700" fill="#9e7a38" letter-spacing="1.3">CLIENTS</text>

    <g transform="translate(40,124)">
      <rect width="230" height="86" rx="13" fill="#ffffff" stroke="#dcd1bc" filter="url(#ashadow)"/>
      <rect width="4" height="86" rx="2" fill="#b24422"/>
      <text x="22" y="30" font-size="14" font-weight="700" fill="#2a1f15">Web UI · Nuxt 3</text>
      <text x="22" y="50" font-size="11.5" fill="#554430">10 pages · light / dark theme</text>
      <text x="22" y="68" font-size="11.5" fill="#766551">responsive 320 → 2560 px</text>
    </g>

    <g transform="translate(40,222)">
      <rect width="230" height="86" rx="13" fill="#ffffff" stroke="#dcd1bc" filter="url(#ashadow)"/>
      <rect width="4" height="86" rx="2" fill="#2e5d7f"/>
      <text x="22" y="30" font-size="14" font-weight="700" fill="#2a1f15">MCP client</text>
      <text x="22" y="50" font-size="11.5" fill="#554430">Claude Code · Cursor · any</text>
      <text x="22" y="68" font-size="11.5" fill="#766551">stdio transport</text>
    </g>

    <g transform="translate(40,320)">
      <rect width="230" height="86" rx="13" fill="#ffffff" stroke="#dcd1bc" filter="url(#ashadow)"/>
      <rect width="4" height="86" rx="2" fill="#3d6e3d"/>
      <text x="22" y="30" font-size="14" font-weight="700" fill="#2a1f15">ragctl CLI</text>
      <text x="22" y="50" font-size="11.5" fill="#554430">setup · up · status · health</text>
      <text x="22" y="68" font-size="11.5" fill="#766551">kb · soul · config · test</text>
    </g>

    <g transform="translate(40,418)">
      <rect width="230" height="86" rx="13" fill="#ffffff" stroke="#dcd1bc" filter="url(#ashadow)"/>
      <rect width="4" height="86" rx="2" fill="#9e7a38"/>
      <text x="22" y="30" font-size="14" font-weight="700" fill="#2a1f15">Plain HTTP</text>
      <text x="22" y="50" font-size="11.5" fill="#554430">no MCP, no agent needed</text>
      <text x="22" y="68" font-size="11.5" fill="#766551">bearer token auth</text>
    </g>
  </g>

  <!-- ================= COLUMN 2 · MCP TOOL LAYER ================= -->
  <g font-family="'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="316" y="112" font-size="11" font-weight="700" fill="#9e7a38" letter-spacing="1.3">TOOL LAYER</text>
    <g transform="translate(316,124)">
      <rect width="252" height="380" rx="16" fill="url(#aink)" stroke="#4a3a29" filter="url(#ashadowdk)"/>
      <rect width="252" height="4" rx="2" fill="#e8c878"/>
      <text x="22" y="34" font-size="14.5" font-weight="700" fill="#f6efe2">kb-mcp</text>
      <text x="22" y="53" font-size="11" fill="#a6967f">Model Context Protocol server</text>
      <rect x="22" y="64" width="208" height="1" fill="#c49846" fill-opacity="0.30"/>
      <text x="22" y="86" font-size="11" fill="#cbb99e">KB CRUD · documents · files</text>
      <text x="22" y="106" font-size="11" fill="#cbb99e">Search (BM25 · vector · two-stage)</text>
      <text x="22" y="126" font-size="11" fill="#cbb99e">Knowledge graph</text>
      <text x="22" y="146" font-size="11" fill="#cbb99e">Experience lifecycle</text>
      <text x="22" y="166" font-size="11" fill="#cbb99e">SOUL persona</text>
      <text x="22" y="186" font-size="11" fill="#cbb99e">Parse · tags · vector · project</text>
      <rect x="22" y="204" width="208" height="1" fill="#c49846" fill-opacity="0.22"/>
      <text x="22" y="228" font-size="10.5" fill="#8f7f68">Writes → HTTP API</text>
      <text x="22" y="244" font-size="10.5" fill="#8f7f68">Reads  → direct file access</text>
      <rect x="22" y="260" width="208" height="1" fill="#c49846" fill-opacity="0.22"/>
      <g>
        <circle cx="30" cy="284" r="4" fill="#e0553a"/>
        <text x="42" y="288" font-size="10.5" fill="#cbb99e">experience-first on fault queries</text>
        <circle cx="30" cy="306" r="4" fill="#e8c878"/>
        <text x="42" y="310" font-size="10.5" fill="#cbb99e">content verification is mandatory</text>
        <circle cx="30" cy="328" r="4" fill="#58a6ff"/>
        <text x="42" y="332" font-size="10.5" fill="#cbb99e">blind spots declared, not hidden</text>
      </g>
      <rect x="22" y="348" width="208" height="1" fill="#c49846" fill-opacity="0.22"/>
      <text x="22" y="368" font-size="10.5" fill="#8f7f68">parse tools are non-blocking</text>
    </g>
  </g>

  <!-- ================= COLUMN 3 · SERVICES ================= -->
  <g font-family="'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="618" y="112" font-size="11" font-weight="700" fill="#9e7a38" letter-spacing="1.3">SERVICES</text>

    <g transform="translate(618,124)">
      <rect width="278" height="106" rx="13" fill="#ffffff" stroke="#dcd1bc" filter="url(#ashadow)"/>
      <rect width="4" height="106" rx="2" fill="#b24422"/>
      <text x="22" y="30" font-size="14" font-weight="700" fill="#2a1f15">Nuxt server · proxy</text>
      <text x="22" y="50" font-size="11.5" fill="#554430">file tree · KB search · parse proxy</text>
      <text x="22" y="68" font-size="11.5" fill="#554430">preview · auth · API routes</text>
      <text x="22" y="90" font-size="10.5" fill="#9e7a38">browser never calls the backend directly</text>
    </g>

    <g transform="translate(618,242)">
      <rect width="278" height="106" rx="13" fill="#ffffff" stroke="#dcd1bc" filter="url(#ashadow)"/>
      <rect width="4" height="106" rx="2" fill="#2e5d7f"/>
      <text x="22" y="30" font-size="14" font-weight="700" fill="#2a1f15">FastAPI backend</text>
      <text x="22" y="50" font-size="11.5" fill="#554430">parse scheduling · vector service</text>
      <text x="22" y="68" font-size="11.5" fill="#554430">graph · experience · SOUL</text>
      <text x="22" y="90" font-size="10.5" fill="#2e5d7f">port probe refuses to double-start</text>
    </g>

    <g transform="translate(618,360)">
      <rect width="278" height="106" rx="13" fill="#ffffff" stroke="#dcd1bc" filter="url(#ashadow)"/>
      <rect width="4" height="106" rx="2" fill="#9e7a38"/>
      <text x="22" y="30" font-size="14" font-weight="700" fill="#2a1f15">MinerU OCR</text>
      <text x="22" y="50" font-size="11.5" fill="#554430">PDF → Markdown, layout + tables</text>
      <text x="22" y="68" font-size="11.5" fill="#554430">managed subprocess</text>
      <text x="22" y="90" font-size="10.5" fill="#9e7a38">ephemeral port · dies with parent</text>
    </g>

    <g transform="translate(618,478)">
      <rect width="278" height="72" rx="13" fill="#f3ead0" stroke="#e0d0a8"/>
      <text x="22" y="30" font-size="12" font-weight="700" fill="#6d5422">Single source of truth</text>
      <text x="22" y="50" font-size="11.5" fill="#766551">config.yml → ports · hosts · models</text>
    </g>
  </g>

  <!-- ================= COLUMN 4 · STORAGE ================= -->
  <g font-family="'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="932" y="112" font-size="11" font-weight="700" fill="#9e7a38" letter-spacing="1.3">STORAGE</text>

    <g transform="translate(932,124)">
      <rect width="308" height="86" rx="13" fill="#ffffff" stroke="#dcd1bc" filter="url(#ashadow)"/>
      <rect width="4" height="86" rx="2" fill="#b24422"/>
      <text x="22" y="30" font-size="13" font-weight="700" fill="#2a1f15">Tree file system</text>
      <text x="22" y="50" font-size="11" fill="#554430">.tree-fs.json · .knowledge-base.yml</text>
      <text x="22" y="68" font-size="11" fill="#766551">authoritative tree + per-KB index</text>
    </g>

    <g transform="translate(932,222)">
      <rect width="308" height="86" rx="13" fill="#ffffff" stroke="#dcd1bc" filter="url(#ashadow)"/>
      <rect width="4" height="86" rx="2" fill="#3d6e3d"/>
      <text x="22" y="30" font-size="13" font-weight="700" fill="#2a1f15">ChromaDB</text>
      <text x="22" y="50" font-size="11" fill="#554430">chunk embeddings · one collection / KB</text>
      <text x="22" y="68" font-size="11" fill="#766551">cosine similarity recall stage</text>
    </g>

    <g transform="translate(932,320)">
      <rect width="308" height="86" rx="13" fill="#ffffff" stroke="#dcd1bc" filter="url(#ashadow)"/>
      <rect width="4" height="86" rx="2" fill="#2e5d7f"/>
      <text x="22" y="30" font-size="13" font-weight="700" fill="#2a1f15">Neo4j</text>
      <text x="22" y="50" font-size="11" fill="#554430">document graph · cross-KB bridges</text>
      <text x="22" y="68" font-size="11" fill="#766551">shared tags · content similarity</text>
    </g>

    <g transform="translate(932,418)">
      <rect width="308" height="86" rx="13" fill="#ffffff" stroke="#dcd1bc" filter="url(#ashadow)"/>
      <rect width="4" height="86" rx="2" fill="#9e7a38"/>
      <text x="22" y="30" font-size="13" font-weight="700" fill="#2a1f15">SQLite</text>
      <text x="22" y="50" font-size="11" fill="#554430">auth · chat history · meditation signals</text>
      <text x="22" y="68" font-size="11" fill="#766551">WAL mode · separate DBs, no lock fights</text>
    </g>

    <g transform="translate(932,516)">
      <rect width="308" height="72" rx="13" fill="#f6efe2" stroke="#dcd1bc" stroke-dasharray="5 4"/>
      <text x="22" y="30" font-size="11.5" font-weight="700" fill="#766551">models_cache/</text>
      <text x="22" y="50" font-size="11" fill="#8f7f68">embedding weights, downloaded on sync</text>
    </g>
  </g>

  <!-- ================= CONNECTORS ================= -->
  <g stroke="#b9a583" stroke-width="1.8" fill="none">
    <path d="M272 167 H300 V200 H316" marker-end="url(#aout)"/>
    <path d="M272 265 H300 V250 H316" marker-end="url(#aout)"/>
    <path d="M272 363 H290 V300 H316" marker-end="url(#aout)"/>
    <path d="M272 461 H288 V350 H316" marker-end="url(#aout)"/>
  </g>
  <g stroke="#b9a583" stroke-width="1.8" fill="none" stroke-dasharray="6 5">
    <path d="M568 200 H600 V177 H618" marker-end="url(#aout)"/>
    <path d="M568 300 H618" marker-end="url(#aout)"/>
  </g>
  <g stroke="#b9a583" stroke-width="1.8" fill="none">
    <path d="M896 177 H914 V167 H932" marker-end="url(#aout)"/>
    <path d="M896 295 H914 V265 H932" marker-end="url(#aout)"/>
    <path d="M896 413 H914 V363 H932" marker-end="url(#aout)"/>
    <path d="M896 413 H914 V461 H932" marker-end="url(#aout)"/>
  </g>

  <!-- storage → tool layer: the MCP server's read path -->
  <g stroke="#d8c090" stroke-width="1.6" fill="none" stroke-dasharray="5 5" opacity="0.8">
    <path d="M932 265 H900 V300 H880" marker-end="url(#aoutw)"/>
  </g>

  <g font-family="'DM Sans', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8f7f68">
    <text x="600" y="204">HTTP</text>
    <text x="886" y="256" text-anchor="end">reads</text>
  </g>
</svg>
