# ============================================
# RAG Knowledge Platform - Shared Configuration
# ============================================
# Single source of truth for ports and shared settings.
# Env vars in .env override values here.
# ============================================

# -- Server (ports, CORS, host) --
server:
  cors_origins:
    - "*"
  auth:
    enabled: true
  rate_limit:
    enabled: true
    window_sec: 60
    max_requests: 600
    heavy_max: 60
  dev:
    host: "0.0.0.0"
    backend_port: 8770
    frontend_port: 6789
    backend_url: "http://localhost:8770"
  prod:
    host: "0.0.0.0"
    backend_port: 8001
    frontend_port: 3000
    backend_url: "http://localhost:8001"

# -- Storage (tree-file-system path) --
storage:
  tree_fs_root: "./storage/tree-file-system"

# -- Vector Search (ChromaDB) --
vector:
  enabled: true
  persist_dir: "./chroma_db"
  collection_prefix: "kb_"
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5
  score_threshold: 0.35
  experience_score_threshold: 0.55

# -- Embedding Model --
embedding:
  model_name: "BAAI/bge-m3"
  model_source: "modelscope"
  cache_dir: "./models_cache"
  device: "auto"
  batch_size: 32
  normalize: true

# -- Knowledge Graph (Neo4j) --
graph:
  enabled: true
  mode: "local"
  auto_start: true
  uri: "bolt://127.0.0.1:7687"
  bolt_port: 7687
  http_port: 7474
  username: "neo4j"
  password: "${NEO4J_PASSWORD:-123456}"
  database: "neo4j"
  home: "./backend/.neo4j"
  data_dir: "./neo4j_data"
  log_dir: "./neo4j_logs"
  version: "5.20.0"
  heap: "1G"
  pagecache: "1G"
  mirror: ""
  pool:
    max_connection_pool_size: 50
    connection_acquisition_timeout: 30
    max_connection_lifetime: 3600
  retry:
    max_attempts: 3
    base_delay: 0.5

# -- Two-Stage Search --
search:
  two_stage:
    enabled: true
    stage1_top_k: 20
    stage2_top_k: 5
    stage1_keyword_weight: 0.5
    stage1_graph_weight: 0.5
    graph_neighbor_depth: 1
    min_candidates: 3
    stage1_pool_multiplier: 8
    kb_aware_candidates: true
    bm25_max_content_chars: 32000

# -- Ingestion (large-doc split) --
ingestion:
  large_doc:
    auto_split: true
    max_chars: 30000
    overlap_chars: 400

experience_auto:
  enabled: false
  interval_hours: 24
  lookback_days: 7
  min_cluster_count: 2
  max_drafts_per_run: 5
  dry_run: false

soul:
  default_harness: "omp"
