# ============================================
# RAG Knowledge Platform - Shared Configuration
# ============================================
# Single source of truth for ports and shared settings.
# Env vars in .env override values here.
# ============================================

# -- Server (ports, CORS, host) --
server:
  cors_origins:
    - "*"
  auth:
    enabled: false
  rate_limit:
    enabled: true
    window_sec: 60
    max_requests: 600
    heavy_max: 60
  dev:
    host: "0.0.0.0"
    backend_port: 8765
    frontend_port: 6789
    backend_url: "http://localhost:8765"
  prod:
    host: "0.0.0.0"
    backend_port: 8001
    frontend_port: 3000
    backend_url: "http://localhost:8001"

# -- Storage (tree-file-system path) --
storage:
  tree_fs_root: "./storage/tree-file-system"

# -- Vector Search (ChromaDB) --
vector:
  enabled: true
  persist_dir: "./chroma_db"
  collection_prefix: "kb_"
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5
  score_threshold: 0.35
  experience_score_threshold: 0.55

# -- Embedding Model --
embedding:
  model_name: "BAAI/bge-m3"
  model_source: "modelscope"
  cache_dir: "./models_cache"
  device: "auto"
  batch_size: 32
  normalize: true

# -- Knowledge Graph (Neo4j) --
# mode: local = 本地安装自动启动(无需 Docker, 发行版+JRE 在 backend/.neo4j/)
#       docker = 由 docker compose 管理(旧方式)
graph:
  enabled: true
  mode: "local"
  auto_start: true          # backend 启动时自动拉起本地 Neo4j(MinerU 同款懒启动)
  uri: "bolt://127.0.0.1:7687"
  bolt_port: 7687
  http_port: 7474
  username: "neo4j"
  password: "${NEO4J_PASSWORD:-123456}"
  database: "neo4j"
  home: "./backend/.neo4j"   # 本地发行版 + 内置 JRE(与 backend/.venv 同级)
  data_dir: "./neo4j_data"   # 数据目录(与旧 docker 卷同名, 便于迁移)
  log_dir: "./neo4j_logs"
  version: "5.20.0"
  heap: "1G"
  pagecache: "1G"
  mirror: ""                 # 下载镜像(留空=官方源 dist.neo4j.org / adoptium)
  pool:
    max_connection_pool_size: 50
    connection_acquisition_timeout: 30
    max_connection_lifetime: 3600
  retry:
    max_attempts: 3
    base_delay: 0.5

# -- Two-Stage Search --
search:
  two_stage:
    enabled: true
    stage1_top_k: 20
    stage2_top_k: 5
    stage1_keyword_weight: 0.5
    stage1_graph_weight: 0.5
    graph_neighbor_depth: 1
    min_candidates: 3

experience_auto:
  enabled: false
  interval_hours: 24
  lookback_days: 7
  min_cluster_count: 2
  max_drafts_per_run: 5
  dry_run: false
